<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minds of Tomorrow</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Minds of Tomorrow</h1>
        <p>Shaping the future with innovation</p>
    </header>
    <main>
        <section style="display: flex; align-items: center; gap: 2rem;">
            <div class="text-content" style="flex: 1; text-align: left;">
                <h2>About Us</h2>
                <p>We are dedicated to shaping the future with innovative ideas and cutting-edge technology.</p>
            </div>
            <div class="gallery" style="flex: 1; display: flex; justify-content: flex-end;">
                <img src="images/banner-1.jpg" alt="Banner 1" style="width: 100%; max-width: 300px;">
            </div>
        </section>
        <section style="display: flex; align-items: center; gap: 2rem;">
            <div class="text-content" style="flex: 1; text-align: left;">
                <h2>Our Mission</h2>
                <p>To inspire and empower the next generation of thinkers and creators.</p>
            </div>
            <div class="gallery" style="flex: 1; display: flex; justify-content: flex-end;">
                <img src="images/banner-2.jpg" alt="Banner 2" style="width: 100%; max-width: 300px;">
            </div>
        </section>
        <section>
            <div class="text-content">
                <h2>Gallery</h2>
            </div>
            <div class="gallery">
                <img src="images/section-1.png" alt="Section 1">
                <img src="images/section-2-a.jpeg" alt="Section 2A">
                <img src="images/section-2-b.jpeg" alt="Section 2B">
                <img src="images/section-2-c.jpeg" alt="Section 2C">
                <img src="images/section-2-d.jpeg" alt="Section 2D">
                <img src="images/section-3.png" alt="Section 3">
                <img src="images/section-4-a.jpg" alt="Section 4A">
                <img src="images/section-4-b.jpg" alt="Section 4B">
                <img src="images/section-4-c.jpg" alt="Section 4C">
                <img src="images/section-4-d.jpg" alt="Section 4D">
            </div>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 Minds of Tomorrow. All rights reserved.</p>
    </footer>
</body>
</html>
